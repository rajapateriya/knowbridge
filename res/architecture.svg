<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; fill: #111; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; fill: #111; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; fill: #111; }
      .muted { fill: #444; }
      .box { fill: #ffffff; stroke: #111; stroke-width: 2; rx: 12; }
      .group { fill: #f7f7f7; stroke: #999; stroke-width: 2; rx: 18; }
      .arrow { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111" />
    </marker>
  </defs>

  <text x="40" y="52" class="title">KnowBridge — System Architecture</text>
  <text x="40" y="82" class="small muted">RAG pipeline with incremental indexing, persistent vector DB, grounded generation, and session memory</text>

  <!-- UI Group -->
  <rect x="40" y="120" width="360" height="250" class="group" />
  <text x="60" y="152" class="label">Interface (Gradio)</text>

  <rect x="70" y="175" width="300" height="70" class="box" />
  <text x="90" y="205" class="label">Knowledge Base Tab</text>
  <text x="90" y="228" class="small muted">Upload .md → index (upsert)</text>

  <rect x="70" y="265" width="300" height="70" class="box" />
  <text x="90" y="295" class="label">Chat Tab</text>
  <text x="90" y="318" class="small muted">Ask question → get grounded answer</text>

  <!-- Indexing Group -->
  <rect x="440" y="120" width="360" height="250" class="group" />
  <text x="460" y="152" class="label">Indexing (document_indexer)</text>

  <rect x="470" y="175" width="300" height="62" class="box" />
  <text x="490" y="203" class="label">Upsert + File Hash</text>
  <text x="490" y="224" class="small muted">added / updated / unchanged</text>

  <rect x="470" y="245" width="300" height="62" class="box" />
  <text x="490" y="273" class="label">Chunking</text>
  <text x="490" y="294" class="small muted">Recursive splitter (1000 / 200)</text>

  <rect x="470" y="315" width="300" height="62" class="box" />
  <text x="490" y="343" class="label">Embeddings</text>
  <text x="490" y="364" class="small muted">all-MiniLM-L6-v2</text>

  <!-- Storage Group -->
  <rect x="840" y="120" width="320" height="250" class="group" />
  <text x="860" y="152" class="label">Storage (ChromaDB)</text>

  <rect x="870" y="195" width="260" height="110" class="box" />
  <text x="890" y="225" class="label">Persistent Vector DB</text>
  <text x="890" y="248" class="small muted">outputs/vector_db</text>
  <text x="890" y="271" class="small muted">collection: knowledge_base</text>
  <text x="890" y="294" class="small muted">cosine (HNSW)</text>

  <!-- RAG Group -->
  <rect x="40" y="410" width="1120" height="260" class="group" />
  <text x="60" y="442" class="label">RAG Pipeline (rag_pipeline)</text>

  <rect x="70" y="470" width="260" height="78" class="box" />
  <text x="90" y="502" class="label">Load Session Memory</text>
  <text x="90" y="525" class="small muted">SQLite history + summary</text>

  <rect x="350" y="470" width="250" height="78" class="box" />
  <text x="370" y="502" class="label">Retrieve Top-K</text>
  <text x="370" y="525" class="small muted">threshold + fallback</text>

  <rect x="620" y="470" width="260" height="78" class="box" />
  <text x="640" y="502" class="label">Grounded Prompt</text>
  <text x="640" y="525" class="small muted">docs-only + SOURCES</text>

  <rect x="900" y="470" width="240" height="78" class="box" />
  <text x="920" y="502" class="label">Groq LLM</text>
  <text x="920" y="525" class="small muted">llama-3.1-8b-instant</text>

  <rect x="620" y="565" width="520" height="78" class="box" />
  <text x="640" y="597" class="label">Response + Traceability</text>
  <text x="640" y="620" class="small muted">Answer rendered + referenced sources persisted</text>

  <!-- Config + DB -->
  <rect x="70" y="565" width="260" height="78" class="box" />
  <text x="90" y="597" class="label">Config (YAML)</text>
  <text x="90" y="620" class="small muted">n_results, threshold, model</text>

  <!-- Arrows -->
  <path class="arrow" d="M 370 210 C 410 210, 420 210, 470 210" />
  <path class="arrow" d="M 370 300 C 410 300, 420 300, 470 300" />

  <path class="arrow" d="M 770 345 C 810 345, 830 330, 870 300" />

  <path class="arrow" d="M 200 548 C 200 560, 200 560, 200 565" />
  <path class="arrow" d="M 330 509 C 340 509, 340 509, 350 509" />
  <path class="arrow" d="M 600 509 C 610 509, 610 509, 620 509" />
  <path class="arrow" d="M 880 509 C 890 509, 890 509, 900 509" />

  <path class="arrow" d="M 1020 548 C 1020 560, 900 565, 880 565" />

  <!-- Storage used by retrieval -->
  <path class="arrow" d="M 1000 305 C 1000 390, 520 400, 520 470" />

  <!-- Upload triggers indexing -->
  <path class="arrow" d="M 370 210 C 410 210, 420 210, 470 210" opacity="0"/>
  <path class="arrow" d="M 370 210 C 410 210, 420 210, 470 210" />

  <!-- Knowledge base -> Indexing (from KB tab) -->
  <path class="arrow" d="M 370 210 C 400 210, 420 210, 470 210" />

  <!-- Chat -> Memory load -->
  <path class="arrow" d="M 370 300 C 400 300, 45 300, 70 505" />
</svg>
